name: Verificación de PartePro
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Iniciar Supabase efímero
        run: npx --yes supabase@3.4.0 start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - run: node scripts/local-env.mjs
      - run: node --env-file=.env.local tests/database/security.mjs
      - if: always()
        run: npx --yes supabase@3.4.0 stop --no-backup
